    var goles = golesPorJugador();
    btnCopiar.classList.add("desactivado");
    btnWa.classList.add("desactivado");
    btnWa.href = "#";
    // Aunque la web todavía no dé ninguna plantilla, se sigue mostrando el acceso al panel de
    // administrador: así se puede entrar a meterla a mano en vez de quedarse sin forma de
    // llegar al panel solo porque el scraping no ha funcionado todavía.
    if (!lista.length) {
      elMensaje.innerHTML = '<p class="estado">Todavía no se ha podido leer la plantilla del equipo desde la web' +
        (adminActivo ? '.' : '. Puedes añadirla a mano desde el panel de administrador.') + '</p>' + pieAdmin();
      if (adminActivo) {
        var btnG = document.getElementById("admin-guardar");
        if (btnG) btnG.addEventListener("click", guardarPlantillaManual);
        activarBotonNuevoJugador();
        activarBotonSalirAdmin();
      } else {
        var btnA = document.getElementById("admin-abrir");
        if (btnA) btnA.addEventListener("click", abrirModalAdmin);
      }
      return;
    }
    // Vista pública (sin sesión de administrador): rejilla de fichas tipo "cromo" -foto grande,
    // dorsal y nombre superpuestos abajo, sin posición ni más datos-, en vez de la lista de
    // filas con los campos de edición, que solo tiene sentido con el panel abierto.
    if (!adminActivo) {
      var fichas = lista.map(function (j) {
        var fotoHtml = j.foto
          ? '<img class="avatar-foto" src="' + j.foto + '" alt="">'
          : '<div class="ficha-sin-foto">' + (j.dorsal !== null && j.dorsal !== undefined ? j.dorsal : "?") + "</div>";
        return '<div class="ficha-jugador">' + fotoHtml +
          '<div class="ficha-pie">' +
          '<div class="ficha-dorsal">' + (j.dorsal !== null && j.dorsal !== undefined ? j.dorsal : "") + '</div>' +
          '<div class="ficha-nombre">' + escapar(j.apodo || j.nombre) + "</div>" +
          "</div></div>";
      }).join("");
      elMensaje.innerHTML = '<div class="plantilla-grid">' + fichas + "</div>" + pieAdmin();
      var btnAbrir = document.getElementById("admin-abrir");
      if (btnAbrir) btnAbrir.addEventListener("click", abrirModalAdmin);
      autoAjustarFichas();
      return;
    }
    var filas = lista.map(function (j, i) {
      var avatarHtml = j.foto
        ? '<img class="avatar-foto" src="' + j.foto + '" alt="">'
        : (j.dorsal !== null && j.dorsal !== undefined
            ? '<div class="dorsal">' + j.dorsal + "</div>"
            : '<div class="dorsal sin">?</div>');
      var nGoles = goles[normNombre(j.nombre)] || 0;
      var golesHtmlJug = nGoles ? '<span class="goles-jugador">⚽ ' + nGoles + "</span>" : "";
      var camposAdmin = adminActivo
        ? '<div class="campos-admin">' +
          '<input class="nombre-in" type="text" placeholder="Nombre y apellidos" ' +
          'value="' + escapar(j.nombre) + '" data-id="' + escapar(j.id) + '">' +
          '<input class="apodo-in" type="text" placeholder="Apodo (como se le conoce en el equipo, si es distinto)" ' +
          'value="' + escapar(j.apodo || "") + '" data-id="' + escapar(j.id) + '">' +
          '<div class="fila-campos">' +
          '<input class="dorsal-in" type="number" min="1" max="99" inputmode="numeric" placeholder="Dorsal" ' +
          'value="' + (j.dorsal !== null && j.dorsal !== undefined ? j.dorsal : "") + '" data-id="' + escapar(j.id) + '">' +
          '<input class="fecha-in" type="text" placeholder="Fecha nacimiento (DD-MM-AAAA)" ' +
          'value="' + escapar(j.fecha_nacimiento || "") + '" data-id="' + escapar(j.id) + '">' +
          "</div></div>" +
          '<div class="foto-admin">' +
          '<input class="foto-in" type="file" accept="image/*" data-id="' + escapar(j.id) + '">' +
          (j.foto ? '<button type="button" class="foto-quitar" data-id="' + escapar(j.id) + '">Quitar foto</button>' : "") +
          "</div>" +
          '<button type="button" class="jugador-eliminar" data-id="' + escapar(j.id) + '" ' +
          'data-nombre-mostrado="' + escapar(j.nombre) + '">Eliminar jugador</button>'
        : "";
      var nombreMostrado = escapar(j.nombre) + (!adminActivo && j.apodo ? ' «' + escapar(j.apodo) + '»' : "");
      var nacimiento = !adminActivo && j.fecha_nacimiento
        ? '<div class="nacimiento">Nacido el ' + escapar(j.fecha_nacimiento) + "</div>" : "";
      return '<div class="jugador">' + avatarHtml +
        '<div class="info"><div class="nombre">' + nombreMostrado + golesHtmlJug + "</div>" + nacimiento + camposAdmin + "</div></div>";
    }).join("");
    elMensaje.innerHTML = '<div class="plantilla-lista">' + filas + "</div>" + pieAdmin();
    if (adminActivo) {
      document.getElementById("admin-guardar").addEventListener("click", guardarPlantillaManual);
      Array.prototype.forEach.call(elMensaje.querySelectorAll(".foto-in"), function (inp) {
        inp.addEventListener("change", function () {
          var f = inp.files && inp.files[0];
          if (!f) return;
          var id = inp.getAttribute("data-id");
          procesarFoto(f, function (dataUrl) {
            // Antes de tocar nada hay que volcar a overridesPlantilla lo que haya escrito en
            // TODAS las filas (no solo esta): si no, como pintarPlantilla() reconstruye la
            // lista entera a partir de overridesPlantilla, cualquier dorsal/nombre/fecha que
            // se hubiera escrito en otra fila sin pulsar "Guardar" todavía se perdía al subir
            // una foto en cualquier otra fila (este era el motivo de que algunos dorsales no
            // se guardaran).
            leerCamposPlantilla();
            if (!overridesPlantilla[id]) overridesPlantilla[id] = { dorsal: null, apodo: null, fecha_nacimiento: null, foto: null };
            overridesPlantilla[id].foto = dataUrl;
            guardarOverridesEnLocalStorage();
            pintarPlantilla();
          });
        });
      });
      Array.prototype.forEach.call(elMensaje.querySelectorAll(".foto-quitar"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-id");
          // Mismo motivo que en el cambio de foto: hay que capturar primero lo escrito en
          // todas las filas, para no perderlo al repintar la lista.
          leerCamposPlantilla();
          var o = overridesPlantilla[id];
          if (o) {
            delete o.foto;
            if (!o.dorsal && !o.apodo && !o.fecha_nacimiento && !o.foto && !o.nombre && !o.eliminado) delete overridesPlantilla[id];
          }
          guardarOverridesEnLocalStorage();
          pintarPlantilla();
        });
      });
      // Eliminar jugador: se marca con "eliminado" en vez de borrarse sin más, para que
      // plantillaFusionada() lo quite de la lista (aunque la web lo siga publicando) y para que
      // esa baja se guarde igual que cualquier otro cambio manual, al pulsar "Guardar".
      Array.prototype.forEach.call(elMensaje.querySelectorAll(".jugador-eliminar"), function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-id");
          var nombreMostrado = btn.getAttribute("data-nombre-mostrado") || id;
          if (!window.confirm("¿Eliminar a " + nombreMostrado + " de la plantilla?\n\nNo se aplicará de verdad hasta que pulses \"Guardar y descargar plantilla_manual.json\" y subas el archivo al repositorio.")) return;
          leerCamposPlantilla();
          if (!overridesPlantilla[id]) overridesPlantilla[id] = { dorsal: null, apodo: null, fecha_nacimiento: null, foto: null };
          overridesPlantilla[id].eliminado = true;
          guardarOverridesEnLocalStorage();
          pintarPlantilla();
          mostrarToast("Jugador marcado para eliminar: pulsa Guardar y descargar para que se aplique de verdad");
        });
      });
      activarBotonNuevoJugador();
      activarBotonSalirAdmin();
    } else {
      document.getElementById("admin-abrir").addEventListener("click", abrirModalAdmin);
    }
  }

  function leerCamposPlantilla() {
    // Solo se guarda como "manual" lo que sea DISTINTO de lo que ya da la web: así, si el
    // campo venía relleno porque la web ya lo publicaba, no se congela innecesariamente (y
    // si la web llega a publicar más adelante lo que antes solo estaba a mano, el dato de la
    // web vuelve a tomar el relevo en cuanto coincida). El nombre editable es la excepción: se
    // guarda por `id` (el nombre ORIGINAL, de la web o con el que se dio de alta a mano), que
    // nunca cambia aunque se corrija el nombre mostrado -así el resto de los datos manuales de
    // ese jugador no se pierden al renombrarlo.
    var webPorId = {};
    ((datos && datos.plantilla) || []).forEach(function (j) { webPorId[j.nombre] = j; });
    var filas = elMensaje.querySelectorAll(".jugador");
    filas.forEach(function (fila) {
      var inNombre = fila.querySelector(".nombre-in");
      var inApodo = fila.querySelector(".apodo-in");
      var inDorsal = fila.querySelector(".dorsal-in");
      var inFecha = fila.querySelector(".fecha-in");
      if (!inDorsal) return;
      var id = inDorsal.getAttribute("data-id");
      var web = webPorId[id] || {};
      var nombreOriginal = web.nombre || id;
      var nombreNuevo = (inNombre.value || "").trim() || nombreOriginal;
      var dorsal = inDorsal.value.trim() ? parseInt(inDorsal.value, 10) : null;
      var apodo = (inApodo.value || "").trim() || null;
      var fechaNac = inFecha.value.trim() || null;
      var nombreEsManual = nombreNuevo !== nombreOriginal;
      var dorsalEsManual = dorsal !== null && dorsal !== web.dorsal;
      // El apodo no lo da nunca la web (ver aplicar_plantilla_manual en el backend), así que
      // aquí es manual en cuanto se escribe algo, sin comparar contra ningún valor de la web.
      var apodoEsManual = apodo !== null;
      var fechaEsManual = fechaNac !== null && fechaNac !== web.fecha_nacimiento;
      // La foto y la baja ("eliminado") se guardan aparte, en cuanto se elige un archivo o se
      // confirma la baja: aquí solo se respeta lo que ya hubiera, para no perderlo al tocar los
      // otros campos.
      var previo = overridesPlantilla[id] || {};
      var fotoActual = previo.foto || null;
      var eliminadoActual = !!previo.eliminado;
      if (nombreEsManual || dorsalEsManual || apodoEsManual || fechaEsManual || fotoActual || eliminadoActual) {
        overridesPlantilla[id] = {
          nombre: nombreEsManual ? nombreNuevo : null,
          dorsal: dorsalEsManual ? dorsal : null,
          apodo: apodoEsManual ? apodo : null,
          fecha_nacimiento: fechaEsManual ? fechaNac : null,
          foto: fotoActual,
          eliminado: eliminadoActual,
        };
      } else {
        delete overridesPlantilla[id];
      }
    });
  }

  // Redimensiona la foto elegida a un tamaño pequeño (para no meter fotos enormes en el JSON
  // que luego hay que subir a GitHub) y la deja como imagen en base64, lista para guardar.
  function procesarFoto(file, cb) {
    var lector = new FileReader();
    lector.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 200, w = img.width, h = img.height;
        if (w >= h) { if (w > max) { h = Math.round(h * max / w); w = max; } }
        else { if (h > max) { w = Math.round(w * max / h); h = max; } }
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", 0.78));
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(file);
  }

  function guardarOverridesEnLocalStorage() {
    try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify(overridesPlantilla)); } catch (e) {}
  }

  function cargarOverridesDeLocalStorage() {
    try {
      var v = localStorage.getItem(CLAVE_LOCAL);
      if (v) overridesPlantilla = JSON.parse(v) || {};
    } catch (e) { overridesPlantilla = {}; }
  }

  function guardarPlantillaManual() {
    leerCamposPlantilla();
    guardarOverridesEnLocalStorage();
    // `nombre_original` es el `id` estable (ver plantillaFusionada): el backend lo usa para
    // saber a qué jugador de la web corresponde cada entrada, tanto si se ha corregido el
    // nombre como si no. Con archivos plantilla_manual.json guardados antes de esta versión
    // (sin nombre_original) el backend sigue funcionando: usa "nombre" como identificador,
    // igual que hacía hasta ahora.
    var lista = Object.keys(overridesPlantilla).map(function (id) {
      var o = overridesPlantilla[id];
      var obj = { nombre_original: id, nombre: o.nombre || id, dorsal: o.dorsal,
                  apodo: o.apodo, fecha_nacimiento: o.fecha_nacimiento };
      if (o.foto) obj.foto = o.foto;
      if (o.eliminado) obj.eliminado = true;
      return obj;
    });
    var blob = new Blob([JSON.stringify(lista, null, 1)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "plantilla_manual.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    pintarPlantilla();
    mostrarToast("Guardado en este dispositivo y archivo descargado");
  }

  // ---------------------------------------------------------------------
  // Panel de administrador: contraseña comprobada por hash (ver aviso).
  //
  // AVISO IMPORTANTE: esto NO es seguridad real. Al ser una página estática sin
  // servidor, cualquiera que abra las herramientas de desarrollador del navegador
  // puede ver este código y el hash, y con algo de esfuerzo, evitar la comprobación
  // o calcular por fuerza bruta una contraseña que dé el mismo hash. Sirve solo
  // como un cierre "no lo toques sin querer", no como una contraseña de verdad.
  // No reutilices esta contraseña en nada importante.
  // ---------------------------------------------------------------------
  function sha256Hex(texto) {
    var datosBin = new TextEncoder().encode(texto);
    return crypto.subtle.digest("SHA-256", datosBin).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function abrirModalAdmin() {
    claveAdmin.value = "";
    errorAdmin.textContent = "";
    modalAdmin.hidden = false;
    claveAdmin.focus();
  }

  function cerrarModalAdmin() {
    modalAdmin.hidden = true;
  }

  function comprobarClave() {
    var valor = claveAdmin.value;
    if (!valor) return;
    if (!(window.crypto && window.crypto.subtle)) {
      errorAdmin.textContent = "Este navegador no permite comprobar la contraseña de forma segura.";
      return;
    }
    sha256Hex(valor).then(function (hash) {
      if (hash === HASH_ADMIN) {
        adminActivo = true;
        cerrarModalAdmin();
        // El panel de administrador se usa tanto desde Plantilla como desde Noticias: se
        // repinta lo que esté activo en ese momento, sea cual sea desde donde se ha abierto.
        if (activa === "noticias") pintarNoticias();
        else if (activa === "entrenador") pintarEntrenador();
        else pintarPlantilla();
      } else {
        errorAdmin.textContent = "Contraseña incorrecta.";
      }
    });
  }

  // ---------------------------------------------------------------------

  function pintar() {
    var texto = textoActivo();
    tabP.setAttribute("aria-selected", activa === "partidos");
    tabR.setAttribute("aria-selected", activa === "resultados");
    tabC.setAttribute("aria-selected", activa === "clasificacion");
    tabPl.setAttribute("aria-selected", activa === "plantilla");
    tabN.setAttribute("aria-selected", activa === "noticias");
    tabE.setAttribute("aria-selected", activa === "entrenador");
    // La barra de Copiar/WhatsApp interesa en Partidos (para enviar el aviso del próximo
    // partido), en Resultados (para enviar el resultado ya conocido) y en Entrenador (para
    // enviar la convocatoria ya armada); en Clasificación, Plantilla y Noticias no hay nada
    // que compartir.
    document.body.classList.toggle("sin-barra",
      activa !== "partidos" && activa !== "resultados" && activa !== "entrenador");
    elChips.hidden = activa !== "clasificacion";
    // El día concreto ya se ve en el selector de semana de abajo: aquí, debajo del título, va
    // solo un rótulo fijo (antes salía la misma fecha dos veces).
    if (activa === "partidos" || activa === "resultados") {
      elCuando.textContent = "Partidos Infantil A";
    }
    pintarSelectorSemanas();

    if (activa === "plantilla") {
      pintarPlantilla();
    } else if (activa === "noticias") {
      pintarNoticias();
    } else if (activa === "entrenador") {
      pintarEntrenador();
    } else if (activa === "clasificacion") {
      pintarClasificacion();
      if (texto) {
        btnCopiar.classList.remove("desactivado");
        btnWa.classList.remove("desactivado");
        btnWa.href = "https://wa.me/?text=" + encodeURIComponent(texto);
      } else {
        btnCopiar.classList.add("desactivado");
        btnWa.classList.add("desactivado");
        btnWa.href = "#";
      }
    } else if (!texto) {
      elMensaje.innerHTML = activa === "partidos"
        ? '<p class="estado">No hay partidos guardados para este fin de semana. La página se actualiza cada día a primera hora.</p>'
        : '<p class="estado">No hay resultados publicados de este fin de semana. Aparecen según los va publicando la federación.</p>';
      btnCopiar.classList.add("desactivado");
      btnWa.classList.add("desactivado");
      btnWa.href = "#";
    } else {
      elMensaje.innerHTML = mensajeHtml(texto);
      btnCopiar.classList.remove("desactivado");
      btnWa.classList.remove("desactivado");
      btnWa.href = "https://wa.me/?text=" + encodeURIComponent(texto);
    }

    var avisos = [];
    if (activa === "partidos" && datos.sin_partido && datos.sin_partido.length) {
      avisos.push("<p>Sin partido este fin de semana:<br>" +
        datos.sin_partido.map(escapar).join("<br>") + "</p>");
    }
    if (activa === "partidos" && datos.sin_calendario && datos.sin_calendario.length) {
      avisos.push("<p>Calendario todavía sin publicar por la federación:<br>" +
        datos.sin_calendario.map(escapar).join("<br>") + "</p>");
    }
    if (datos.errores && datos.errores.length) {
      avisos.push("<p>No se han podido consultar: " + escapar(datos.errores.join(", ")) + ". Puede faltar algún dato.</p>");
    }
    elAviso.innerHTML = avisos.join("");

    if (datos.generado) {
      elPie.textContent = "Actualizado el " + formatoGenerado(datos.generado) +
        ". Datos de elbalondemadrid.es (RFFM), no oficiales" +
        (activa === "partidos" ? ": antes de desplazarte, revisa el acta del partido." : ".");
    }
  }

  function elegir(nombre) {
    activa = nombre;
    if (datos) pintar();
  }

  function copiar() {
    var texto = textoActivo();
    if (!texto) return;
    var aviso = function () {
      btnCopiar.textContent = "Mensaje copiado";
      setTimeout(function () { btnCopiar.textContent = "Copiar mensaje"; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(aviso, alternativa);
    } else {
      alternativa();
    }
    function alternativa() {
      var t = document.createElement("textarea");
      t.value = texto;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy"); aviso(); } catch (e) {}
      document.body.removeChild(t);
    }
  }

  tabP.addEventListener("click", function () { elegir("partidos"); });
  tabR.addEventListener("click", function () { elegir("resultados"); });
  tabC.addEventListener("click", function () { elegir("clasificacion"); });
  tabPl.addEventListener("click", function () { elegir("plantilla"); });
  tabN.addEventListener("click", function () { elegir("noticias"); });
  tabE.addEventListener("click", function () { elegir("entrenador"); });
  selSemana.addEventListener("change", function () { sel[activa] = parseInt(selSemana.value, 10); pintar(); });
  btnAnt.addEventListener("click", function () { if (sel[activa] > 0) { sel[activa] -= 1; pintar(); } });
  btnSig.addEventListener("click", function () { if (sel[activa] < semanas().length - 1) { sel[activa] += 1; pintar(); } });
  elChips.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".chip") : null;
    if (!b) return;
    grupoSel = parseInt(b.getAttribute("data-i"), 10) || 0;
    pintar();
  });
  btnCopiar.addEventListener("click", copiar);
  btnAdminEntrar.addEventListener("click", comprobarClave);
  btnAdminCancelar.addEventListener("click", cerrarModalAdmin);
  claveAdmin.addEventListener("keydown", function (e) { if (e.key === "Enter") comprobarClave(); });
  modalAdmin.addEventListener("click", function (e) { if (e.target === modalAdmin) cerrarModalAdmin(); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  var elToast = document.getElementById("toast");
  var toastTimer = null;

  function formatoGenerado(generado) {
    var p = generado.split(" ");
    var d = p[0].split("-");
    return d[2] + "/" + d[1] + "/" + d[0] + " a las " + p[1];
  }

  function mostrarToast(texto) {
    elToast.textContent = texto;
    elToast.classList.add("visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("visible"); }, 4000);
  }

  function cargarDatos(esPrimeraVez) {
    btnActualizar.classList.add("cargando");
    btnActualizar.disabled = true;
    var generadoAntes = datos && datos.generado;
    return fetch("partidos.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        datos = d;
        sel.partidos = indiceSemana(d.desde);
        sel.resultados = indiceSemana(d.resultados_desde);
        if (esPrimeraVez) {
          var dia = new Date().getDay();
          if ((dia === 0 || dia === 1 || dia === 2) && (d.resultados || "").trim()) activa = "resultados";
        }
        pintar();
        if (!esPrimeraVez) {
          mostrarToast(generadoAntes && generadoAntes === d.generado
            ? "Ya tenías la última versión (actualizado el " + formatoGenerado(d.generado) + ")"
            : "Actualizado ahora mismo");
        }
      })
      .catch(function () {
        if (!datos) {
          elMensaje.innerHTML = '<p class="estado">No se han podido cargar los partidos. Comprueba que la acción "Actualizar partidos" de GitHub se ha ejecutado al menos una vez.</p>';
        } else {
          mostrarToast("No se ha podido comprobar: revisa tu conexión.");
        }
      })
      .then(function () {
        btnActualizar.classList.remove("cargando");
        btnActualizar.disabled = false;
      });
  }

  cargarOverridesDeLocalStorage();
  cargarNoticiasDeLocalStorage();
  cargarCuerpoTecnicoDeLocalStorage();
  btnActualizar.addEventListener("click", function () { cargarDatos(false); });
  cargarDatos(true);
})();
</script>
