name: Actualizar partidos

on:
  schedule:
    # Todos los días de la semana, cada 15 minutos de 7:00 a 23:45 en Madrid (5:00-21:45 UTC en
    # horario de verano; con el cambio de hora el rango se desplaza una hora, sin problema: sigue
    # cubriendo de sobra el horario en que puede publicarse un cambio de horario/campo o un
    # resultado). El minuto NO es "0"/"15"/"30"/"45" en punto a propósito: GitHub retrasa o
    # incluso descarta ejecuciones programadas justo en esos minutos redondos, que son cuando
    # más carga tienen sus servidores (lo advierten en su propia documentación).
    - cron: "7-59/15 5-21 * * *"
    # Sábados y domingos, cada 10 minutos (de 11:03 a 23:53 en Madrid) para recoger resultados
    # lo antes posible en cuanto la federación los publique -más denso que el resto de la
    # semana, porque es cuando se juega y se necesita la mayor frescura posible-
    - cron: "3/10 9-22 * * 6,0"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 "playwright==1.55.0"

      # El navegador solo hace falta cuando algún partido ya jugado no tiene resultado y el
      # acta todavía no lo da (ver completar_pendientes_con_navegador en el script). Se deja
      # en caché para no volver a descargar Chromium (~100 MB) en cada ejecución.
      - name: Caché del navegador de Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}

      - name: Instalar Chromium para Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Generar partidos
        run: python partidos_whatsapp.py --json partidos.json --estado estado.json

      - name: Guardar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partidos.json estado.json
          git diff --cached --quiet || git commit -m "Actualizar partidos"
          git pull --rebase
          git push
